# Development docker-compose file
# This file will run the app in development mode
# ${} are environment variables that will be replaced
# with the values in the .env file
services:
  # App service
  # This service will run the application
  clinical: 
    # Image to use
    # Change <app name> with the name of the app
    image: img-clinical-dev:latest

    # Environment file to use
    env_file:
      - ./clinica-nestjs/dev.env

    # Environment variables
    environment:
      NODE_ENV: ${CLINICA_NODE_ENV}

    # Container name
    # Used to identify the container
    # Also to communicate with other containers
    container_name: ${CLINICA_HOST_NAME}

    # Build the app using the previously created
    # Dockerfile
    build:
      context: clinica-nestjs
      dockerfile: Dockerfile.dev

    # Volume to mount the source code
    # This will allow the app to be updated
    # without the need to rebuild the container
    volumes:
      - ./clinica-nestjs/src:/app/src

    # Port forwarding:
    # This will allow the app to be accessed from
    # the host machine.
    # Change <host port> with the port that the app
    # will use in the host machine
    ports:
      - "3000:${CLINICA_PORT}"

    # Los contenedores se encienden al mismo tiempo
    # El contenedor del backend depende del contenedor de la base de datos y que esté activo
    depends_on:
      mysql:
        # Execute the healthcheck of the db service
        condition: service_healthy
  mysql:
      # Image to use
      image: mysql:8.0

      # Container name
      # Used to identify the container
      # Also to communicate with other containers
      container_name: ${CLINICA_DB_HOST_NAME}

      # Restart policy
      # This will restart the container if it stops
      # unexpectedly
      restart: always

      # Environment variables
      environment:
        MYSQL_ROOT_PASSWORD: ${CLINICA_DATABASE_ROOT_PASSWORD}
        MYSQL_DATABASE: ${CLINICA_DATABASE_NAME}
        MYSQL_USER: ${CLINICA_DATABASE_USER}
        MYSQL_PASSWORD: ${CLINICA_DATABASE_PASSWORD}

      # Volumes
      # This will create a named volume to persist MySQL data
      volumes:
        - clinica_data:/var/lib/mysql   # El nombre 'clinica-data' debe coincidir exactamente

      # Healthcheck
      # This will check if the container is healthy (Listening to the port)
      # If not, it will restart the containers that
      # depends on it
      healthcheck:
        test: [
            'CMD',
            'mysqladmin',
            'ping',
            '-h',
            'localhost',
            '-uroot',
            '-p${CLINICA_DATABASE_ROOT_PASSWORD}',
          ]
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
  # Volume for the database
  # Replace <app name> with the name of the app
  clinica_data:     # El nombre debe coincidir con lo que se especifique dentro del volumen.
    driver: local