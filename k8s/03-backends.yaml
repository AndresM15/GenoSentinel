# ==========================================
# 1. MICROSERVICIO GENÓMICA (DJANGO)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: genomica-service
spec:
  selector:
    app: genomica
  ports:
    - port: 80        # Puerto interno del cluster
      targetPort: 3000 # Puerto del contenedor (Gunicorn)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genomica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genomica
  template:
    metadata:
      labels:
        app: genomica
    spec:
      containers:
      - name: genomica
        image: genosentinel-genomica:latest # Tu imagen local
        imagePullPolicy: Never  # ¡IMPORTANTE PARA LOCAL!
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME_GENOMICA } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-user } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-root-password } }
        - name: ALLOWED_HOSTS
          value: "*"
        - name: CLINICA_BASE_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: CLINICAL_URL } }

---
# ==========================================
# 2. MICROSERVICIO CLÍNICA (NESTJS)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: clinica-service
spec:
  selector:
    app: clinica
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinica
  template:
    metadata:
      labels:
        app: clinica
    spec:
      containers:
      - name: clinica
        image: genosentinel-clinica:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: CLINICA_DB_HOST_NAME
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
        - name: CLINICA_DATABASE_NAME
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME_CLINICA } }
        - name: CLINICA_DATABASE_USER
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-user } }
        - name: CLINICA_DATABASE_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-root-password } }
        - name: CLINICA_DB_TYPE
          value: "mysql"
        - name: CLINICA_DB_PORT
          value: "3306"

---
# ==========================================
# 3. API GATEWAY (SPRING BOOT)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer # Exponer al exterior (localhost:8080)
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: genosentinel-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME_AUTH } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-user } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secrets, key: mysql-root-password } }
        - name: GENOMICS_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: GENOMICS_URL } }
        - name: CLINICAL_URL
          valueFrom: { configMapKeyRef: { name: app-config, key: CLINICAL_URL } }